<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{index :: head}">
        <meta charset="UTF-8">
        <title>Career Detail</title>
    </head>
    <body>
        <header th:insert="~{index :: header}"></header>
        <div th:replace="~{index :: nav}"></div>
        
        <div class="detail-container">
            <div class="page-container">
                <div class="detail-content">
                    <header class="section-header">
                        <h1 class="section-header__title">Request</h1>
                    </header>

                    <a th:href="@{/admin/dashboard}" class="button button--secondary button--small back-button">
                        ← Back to Dashboard
                    </a>

                    <div class="review-detail">
                        <div class="review-detail__metadata">
                            <div class="review-detail__metadata-item">
                                <strong>User:</strong>
                                <span th:text="${request.user.username}">Username</span>
                            </div>
                        </div>
                        
                        <div class="review-detail__content-section">
                            <h5>Reason:</h5>
                            <div class="review-detail__content-box" th:text="${request.body}">
                                Body
                            </div>
                        </div>

                        <div class="review-detail__actions">
                            <form th:action="@{/operations/career/request/accept/{id}(id=${request.id})}" method="POST">
                                <button type="submit" class="button button--success">
                                    Accept
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <div th:replace="~{index :: footer}"></div>
        <script th:replace="~{index :: bootscripts}"></script>
    </body>
</html>
