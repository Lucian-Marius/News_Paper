<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{index :: head}">
        <meta charset="UTF-8">
        <title>Career Detail</title>
    </head>
    <body>
        <header class="bg-dark text-light text-center py-3 mb-4">
            <h1>Welcome to news-paper</h1>
            <p>Your one-stop solution for the latest news articles.</p>
        </header>
        <div class="vh-100">
            <div class="container-fluid bg-body-secondary text-center">
                <div class="row justify-content-center">
                    <div class="col-12">
                        <span>
                            <h1>Request</h1>
                        </span>
                    </div>
                </div>
            </div>

            <div class="container my-5">
                <div class="row justify-content-center">
                    <div class="col-12 col-md-8 d-flex flex-column align-items-center">
                        <div class="text-center">
                            <h2 th:text="${request.user.username}">Username</h2>
                        </div>
                        <hr>
                        <div>
                            <p th:text="${request.body}">Body</p>
                        </div>

                        <div class="d-flex">
                            <form th:action="@{/operations/career/request/accept/{id}(id=${request.id})}" method="POST">
                                <button type="submit" class="btn btn-success me-2">
                                    Accept
                                </button>
                            </form>
                            <a th:href="@{/admin/dashboard}" class="btn btn-primary m-2">
                                Back to Dashboard
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div th:replace="~{index :: footer}"></div>
        <script th:replace="~{index :: bootscripts}"></script>
    </body>
</html>
