<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{index :: head}">
	<title>Career Request</title>
</head>
<body>
	<header th:insert="~{index :: header}"></header>
	<div th:replace="~{index :: nav}"></div>

	<div class="form-container">
		<div class="page-container">
			<div class="form-wrapper">
				<div class="page-header">
					<h1>Career Request</h1>
				</div>
				<form th:action="@{/operations/career/request/save}" method="POST" th:object="${careerRequest}" class="form-card">
					<div class="form-card__body">
						<div class="form-field">
							<label for="body" class="form-field__label">Motivo della richiesta:</label>
							<textarea id="body" class="form-field__textarea" th:field="*{body}" placeholder="Inserisci motivazione..." rows="5"></textarea>
						</div>
						<div class="form-field">
							<label for="role" class="form-field__label">Per quale ruolo?</label>
							<select id="role" th:field="*{role}" class="form-field__select">
								<option value="">-- Seleziona un ruolo --</option>
								<option th:each="role : ${roles}" th:value="${role.id}" th:text="${#strings.substring(role.name, 5)}"></option>
							</select>
						</div>
						<div class="form-actions">
							<a href="/" class="button button--secondary">Annulla</a>
							<button type="submit" class="button button--success">Effettua richiesta</button>
						</div>
					</div>
				</form>
			</div>
		</div>
	</div>

	<footer th:replace="~{index :: footer}"></footer>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
