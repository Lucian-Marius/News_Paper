<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{index :: head}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
</head>
<body>
    <header th:insert="~{index :: header}"></header>

    <nav th:insert="~{index :: nav}"></nav>

    <div class="form-container">
        <div class="page-container">
            <div class="form-wrapper">
                <div class="form-card">
                    <div class="form-card__header">
                        <h2 class="form-card__title">Registration</h2>
                    </div>

                    <div th:if="${param.success}">
                        <div class="alert alert--info">
                            Registered
                        </div>
                    </div>

                    <div class="form-card__body">
                        <form method="post" role="form" th:action="@{/register/save}" th:object="${user}">
                            <div class="form-field">
                                <label class="form-field__label">First Name</label>
                                <input class="form-field__input" id="firstName" name="firstName" th:field="*{firstName}" type="text">
                            </div>

                            <div class="form-field">
                                <label class="form-field__label">Last Name</label>
                                <input class="form-field__input" id="lastName" name="lastName" th:field="*{lastName}" type="text">
                            </div>

                            <div class="form-field">
                                <label class="form-field__label">Email</label>
                                <input class="form-field__input" id="email" name="email" th:field="*{email}" type="email">
                            </div>

                            <div class="form-field">
                                <label class="form-field__label">Password</label>
                                <input class="form-field__input" id="password" name="password" th:field="*{password}" type="password">
                                <p th:errors="*{password}" class="form-field__error" th:if="${#fields.hasErrors('password')}"></p>
                            </div>

                            <div class="form-field">
                                <button class="button button--primary button--full-width" type="submit">Register</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer th:insert="~{index :: footer}"></footer>
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
