<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{index :: head}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - News Paper</title>
</head>
<body>
    <header th:replace="~{index :: header}"></header>
    
    <nav th:replace="~{index :: nav}"></nav>
    
    <div class="form-container">
        <div class="page-container">
            <div class="form-wrapper form-wrapper--narrow">
                <div class="form-card">
                    <div class="form-card__header">
                        <h3 class="form-card__title">Login</h3>
                    </div>
                    <div class="form-card__body">
                        <!-- Login Error Message -->
                        <div th:if="${param.error}" class="alert alert--danger">
                            Invalid username or password!
                        </div>
                        
                        <!-- Logout Success Message -->
                        <div th:if="${param.logout}" class="alert alert--success">
                            You have been logged out successfully!
                        </div>
                        
                        <!-- Session Expired Message -->
                        <div th:if="${param['session-expired']}" class="alert alert--warning">
                            Your session has expired. Please login again.
                        </div>
                        
                        <form th:action="@{/auth/login}" method="post">
                            <div class="form-field">
                                <label for="username" class="form-field__label">Username</label>
                                <input type="text" class="form-field__input" id="username" name="username" required>
                            </div>
                            
                            <div class="form-field">
                                <label for="password" class="form-field__label">Password</label>
                                <input type="password" class="form-field__input" id="password" name="password" required>
                            </div>
                            
                            <div class="form-field">
                                <div class="form-field__checkbox-wrapper">
                                    <input type="checkbox" class="form-field__checkbox" id="remember-me" name="remember-me">
                                    <label class="form-field__label" for="remember-me">Remember me</label>
                                </div>
                            </div>
                            
                            <div class="form-field">
                                <button type="submit" class="button button--primary button--full-width">Login</button>
                            </div>
                        </form>
                        
                        <div class="text-center">
                            <p>Don't have an account? <a th:href="@{/auth/register}">Register here</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <footer th:replace="~{index :: footer}"></footer>
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
