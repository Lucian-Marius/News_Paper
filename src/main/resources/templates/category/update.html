<!DOCTYPE html>
<!-- //create a new category -->
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{index :: head}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Category - News Paper</title>
</head>
<body>
    <header th:insert="~{index :: header}"></header>

    <nav th:insert="~{index :: nav}"></nav>

    <div class="form-container">
        <div class="page-container">
            <div class="form-wrapper form-wrapper--narrow">
                <div class="page-header">
                    <h1>Update Category</h1>
                </div>
                <a href="/admin/dashboard" class="button button--secondary button--small back-button">
                    ← Back to Dashboard
                </a>
                <div class="form-card">
                    <div class="form-card__body">
                        <form th:action="@{/categories/update/{id}(id=${category.id})}" th:object="${category}" method="post">
                            <!-- Category Name -->
                            <div class="form-field">
                                <label for="name" class="form-field__label">Category Name</label>
                                <input type="text" 
                                    class="form-field__input" 
                                    id="name" 
                                    th:field="*{name}" 
                                    placeholder="Enter category name" 
                                    required>
                                <div th:if="${#fields.hasErrors('name')}" 
                                  class="form-field__error" 
                                  th:errors="*{name}"></div>
                            </div>

                            <div class="form-actions">
                                <button type="submit" class="button button--primary button--full-width">Update</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer th:insert="~{index :: footer}"></footer>
</body>
</html>
