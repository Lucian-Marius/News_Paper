<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{index :: head}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Article - News Paper</title>
</head>
<body>
    <header th:insert="~{index :: header}"></header>

    <nav th:insert="~{index :: nav}"></nav>

    <div class="form-container">
        <div class="page-container">
            <div class="form-wrapper">
                <h1 th:text="${title}">Create an Article</h1>
                <a href="/writer/dashboard" class="button button--secondary button--small back-button">
                    ← Back to Dashboard
                </a>
                <div class="form-card">
                    <div class="form-card__body">
                        <form th:action="@{/articles}" th:object="${article}" method="post" enctype="multipart/form-data">
                            <!-- Article Title -->
                            <div class="form-field">
                                <label for="title" class="form-field__label">Article Title</label>
                                <input type="text" 
                                    class="form-field__input" 
                                    id="title" 
                                    th:field="*{title}" 
                                    placeholder="Enter article title" 
                                    required>
                                <div th:if="${#fields.hasErrors('title')}" 
                                  class="form-field__error" 
                                  th:errors="*{title}"></div>
                            </div>

                            <!-- Article Subtitle -->
                            <div class="form-field">
                                <label for="subtitle" class="form-field__label">Subtitle</label>
                                <input type="text" 
                                    class="form-field__input" 
                                    id="subtitle" 
                                    th:field="*{subtitle}" 
                                    placeholder="Enter article subtitle" 
                                    required>
                                <div th:if="${#fields.hasErrors('subtitle')}" 
                                  class="form-field__error" 
                                  th:errors="*{subtitle}"></div>
                            </div>

                            <!-- Image Upload -->
                            <div class="form-field">
                                <label for="image" class="form-field__label">Upload Image</label>
                                <input type="file" class="form-field__input" id="image" name="image" accept="image/*">
                            </div>

                            <!-- Article Content -->
                            <div class="form-field">
                                <label for="body" class="form-field__label">Article Content</label>
                                <textarea class="form-field__textarea" 
                                          id="body" 
                                          th:field="*{body}" 
                                          rows="8" 
                                          placeholder="Write your article content here..." 
                                          required></textarea>
                                <div th:if="${#fields.hasErrors('body')}" 
                                     class="form-field__error" 
                                     th:errors="*{body}"></div>
                            </div>

                            <!-- Error Message Display -->
                            <div th:if="${errorMessage}" class="alert alert--danger" th:text="${errorMessage}"></div>

                            <!-- Category Selection -->
                            <div class="form-field">
                                <label for="category" class="form-field__label">Category</label>
                                <select class="form-field__select" 
                                        id="category" 
                                        th:field="*{category}" 
                                        required>
                                    <option value="">Select a category</option>
                                    <option th:each="cat : ${category}" 
                                            th:value="${cat.id}" 
                                            th:text="${cat.name}">
                                    </option>
                                </select>
                                <div th:if="${#fields.hasErrors('category')}" 
                                     class="form-field__error" 
                                     th:errors="*{category}"></div>
                            </div>

                            <!-- Publish Date -->
                            <div class="form-field">
                                <label for="publishDate" class="form-field__label">Publish Date</label>
                                <input type="date" 
                                       class="form-field__input" 
                                       id="publishDate" 
                                       th:field="*{publishDate}" 
                                       required>
                                <div th:if="${#fields.hasErrors('publishDate')}" 
                                     class="form-field__error" 
                                     th:errors="*{publishDate}"></div>
                            </div>

                            <!-- Submit Buttons -->
                            <div class="form-actions">
                                <a href="/" class="button button--secondary">Cancel</a>
                                <button type="submit" class="button button--primary">
                                    <i class="fas fa-save"></i> Create Article
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer th:insert="~{index :: footer}"></footer>
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
