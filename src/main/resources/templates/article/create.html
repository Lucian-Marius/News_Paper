<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{index :: head}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Article - News Paper</title>
</head>
<body>
    <header th:insert="~{index :: header}"></header>

    <nav th:insert="~{index :: nav}"></nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header">
                        <h3 class="text-center" th:text="${title}">Create an Article</h3>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/articles}" th:object="${article}" method="post">
                            <!-- Article Title -->
                            <div class="mb-3">
                                <label for="subtitle" class="form-label">Article Title</label>
                                <input type="text" 
                                       class="form-control" 
                                       id="subtitle" 
                                       th:field="*{subtitle}" 
                                       placeholder="Enter article title" 
                                       required>
                                <div th:if="${#fields.hasErrors('subtitle')}" 
                                     class="text-danger" 
                                     th:errors="*{subtitle}"></div>
                            </div>

                            <!-- Article Content -->
                            <div class="mb-3">
                                <label for="body" class="form-label">Article Content</label>
                                <textarea class="form-control" 
                                          id="body" 
                                          th:field="*{body}" 
                                          rows="8" 
                                          placeholder="Write your article content here..." 
                                          required></textarea>
                                <div th:if="${#fields.hasErrors('body')}" 
                                     class="text-danger" 
                                     th:errors="*{body}"></div>
                            </div>

                            <!-- Category Selection -->
                            <div class="mb-3">
                                <label for="category" class="form-label">Category</label>
                                <select class="form-select" 
                                        id="category" 
                                        th:field="*{category}" 
                                        required>
                                    <option value="">Select a category</option>
                                    <option th:each="cat : ${category}" 
                                            th:value="${cat.id}" 
                                            th:text="${cat.name}">
                                    </option>
                                </select>
                                <div th:if="${#fields.hasErrors('category')}" 
                                     class="text-danger" 
                                     th:errors="*{category}"></div>
                            </div>

                            <!-- Publish Date -->
                            <div class="mb-3">
                                <label for="publishDate" class="form-label">Publish Date</label>
                                <input type="date" 
                                       class="form-control" 
                                       id="publishDate" 
                                       th:field="*{publishDate}" 
                                       required>
                                <div th:if="${#fields.hasErrors('publishDate')}" 
                                     class="text-danger" 
                                     th:errors="*{publishDate}"></div>
                            </div>

                            <!-- Submit Buttons -->
                            <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                                <a href="/" class="btn btn-secondary me-md-2">Cancel</a>
                                <button type="submit" class="btn btn-primary">
                                    <i class="fas fa-save"></i> Create Article
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer th:insert="~{index :: footer}"></footer>
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
