<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{index :: head}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Article - News Paper</title>
</head>
<body>
    <header th:insert="~{index :: header}"></header>

    <nav th:insert="~{index :: nav}"></nav>

    <div class="form-container">
        <div class="page-container">
            <div class="form-wrapper">
                <div class="page-header">
                    <h1>Edit Article</h1>
                </div>
                <a href="/writer/dashboard" class="button button--secondary button--small back-button">
                    ← Back to Dashboard
                </a>
                <div class="form-card">
                    <div class="form-card__body">
                        <form th:action="@{'/articles/update/' + ${article.id}}" th:object="${article}" method="post" enctype="multipart/form-data">
                            <!-- Article Title -->
                            <div class="form-field">
                                <label for="title" class="form-field__label">Article Title</label>
                                <input type="text"
                                    class="form-field__input"
                                    id="title"
                                    th:field="*{title}"
                                    placeholder="Enter article title"
                                    required>
                                <div th:if="${#fields.hasErrors('title')}"
                                  class="form-field__error"
                                  th:errors="*{title}"></div>
                            </div>

                            <!-- Article Subtitle -->
                            <div class="form-field">
                                <label for="subtitle" class="form-field__label">Subtitle</label>
                                <input type="text"
                                    class="form-field__input"
                                    id="subtitle"
                                    th:field="*{subtitle}"
                                    placeholder="Enter article subtitle"
                                    required>
                                <div th:if="${#fields.hasErrors('subtitle')}"
                                  class="form-field__error"
                                  th:errors="*{subtitle}"></div>
                            </div>

                            <!-- Image Upload -->
                            <div class="form-field">
                                <label for="file" class="form-field__label">Upload New Image (optional)</label>
                                <input type="file" class="form-field__input" id="file" name="file" accept="image/*">
                                <small class="text-muted">Leave empty to keep current image</small>
                            </div>

                            <!-- Article Content -->
                            <div class="form-field">
                                <label for="body" class="form-field__label">Article Content</label>
                                <textarea class="form-field__textarea"
                                          id="body"
                                          th:field="*{body}"
                                          rows="8"
                                          placeholder="Write your article content here..."
                                          required></textarea>
                                <div th:if="${#fields.hasErrors('body')}"
                                     class="form-field__error"
                                     th:errors="*{body}"></div>
                            </div>

                            <!-- Category Selection -->
                            <div class="form-field">
                                <label for="category" class="form-field__label">Category</label>
                                <select class="form-field__select"
                                        id="category"
                                        th:field="*{category}"
                                        required>
                                    <option value="">Select a category</option>
                                    <option th:each="cat : ${categories}"
                                            th:value="${cat.id}"
                                            th:text="${cat.name}"
                                            th:selected="${article.category != null and cat.id == article.category.id}">
                                    </option>
                                </select>
                                <div th:if="${#fields.hasErrors('category')}"
                                     class="form-field__error"
                                     th:errors="*{category}"></div>
                            </div>

                            <!-- Publish Date -->
                            <div class="form-field">
                                <label for="publishDate" class="form-field__label">Publish Date</label>
                                <input type="date"
                                       class="form-field__input"
                                       id="publishDate"
                                       th:field="*{publishDate}"
                                       required>
                                <div th:if="${#fields.hasErrors('publishDate')}"
                                     class="form-field__error"
                                     th:errors="*{publishDate}"></div>
                            </div>

                            <!-- Submit Buttons -->
                            <div class="form-actions">
                                <a th:href="@{/articles}" class="button button--secondary">Cancel</a>
                                <button type="submit" class="button button--primary">
                                    <i class="fas fa-save"></i> Update Article
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer th:insert="~{index :: footer}"></footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
