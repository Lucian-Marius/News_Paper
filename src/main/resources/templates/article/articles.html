<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{index :: head}"></head>
<body>
    <div th:replace="~{index :: nav}"></div>
    <div class="m-3">
        <div th:if="${successMessage}" class="alert alert-success">
            <p th:text="${successMessage}"></p>
        </div>
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-10 mb-5">
                    <h1 class="text-center" th:text="${title}">Index articoli</h1>
                </div>
            </div>
            <div class="container mt-4">
                <!-- Search Forms -->
                <div class="row justify-content-center mb-4">
                    <div class="col-10 col-md-6">
                        <h5>Search by Title, Content, or Author</h5>
                        <form th:action="@{/articles}" method="get" class="d-flex mb-3">
                            <input type="text" name="q" class="form-control me-2" placeholder="Search by title, content, or author..." th:value="${query}">
                            <button type="submit" class="btn btn-primary">Search</button>
                        </form>
                        <h5>Search by Keyword (Title, Subtitle, Author, Category)</h5>
                        <form th:action="@{/articles/search}" method="get" class="d-flex">
                            <input type="text" name="keyword" class="form-control me-2" placeholder="Search by keyword across all fields...">
                            <button type="submit" class="btn btn-secondary">Search</button>
                        </form>
                    </div>
                </div>
                <p th:text="'Articles found: ' + ${articles.size()}"></p>
                <div class="row justify-content-center">
                    <div class="col-10 col-md-4 offset justify-content-center">
                        <div th:each="article : ${articles}">
                            <div class="card mb-4">
                                <div class="card-header">
                                    <img th:if="${article.image == null}" th:src="@{/images/default.jpg}" class="card-img-top" alt="Immagine di default"/>
                                    <img th:if="${article.image != null}" th:src="${article.image.path}" class="card-img-top" alt="Immagine articolo"/>
                                </div>
                                <div class="card-body">
                                    <h5 class="card-title" th:text="${article.title}"></h5>
                                    <p class="card-text" th:text="${article.user.username}"></p>
                                    <a th:href="@{/articles/detail/{id}(id=${article.id})}" class="btn btn-primary">Leggi</a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="row justify-content-center" th:unless="${articles.size() > 0}">
                    <div class="col-10 mb-5">
                        <h3 class="text-center">NESSUN ARTICOLO PRESENTE</h3>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div th:replace="~{index :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
