<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{index :: head}"></head>
<body>
    <header th:insert="~{index :: header}"></header>
    <div th:replace="~{index :: nav}"></div>
    
    <section class="articles-section">
        <div class="page-container">
            <div th:if="${successMessage}" class="alert alert--success">
                <p th:text="${successMessage}"></p>
            </div>
            
            <header class="section-header">
                <h1 class="section-header__title" th:text="${title}">Index articoli</h1>
            </header>
            
            <!-- Search Forms -->
            <div class="search-section">
                <div class="search-forms">
                    <h3>Search by Title, Content, or Author</h3>
                    <form th:action="@{/articles}" method="get" class="form-search">
                        <input type="text" name="q" class="form-search__input" placeholder="Search by title, content, or author..." th:value="${query}">
                        <button type="submit" class="button button--primary form-search__button">Search</button>
                    </form>
                    <h3>Search by Keyword (Title, Subtitle, Author, Category)</h3>
                    <form th:action="@{/articles/search}" method="get" class="form-search">
                        <input type="text" name="keyword" class="form-search__input" placeholder="Search by keyword across all fields...">
                        <button type="submit" class="button button--secondary form-search__button">Search</button>
                    </form>
                </div>
            </div>
            
            <p class="result-count" th:text="'Articles found: ' + ${articles.size()}"></p>
            
            <div class="articles-grid">
                <article class="article-card" th:each="article : ${articles}">
                    <figure class="article-card__figure">
                        <img th:if="${article.image == null}" th:src="@{/images/default.jpg}" class="article-card__image" alt="Default article image"/>
                        <img th:if="${article.image != null}" th:src="${article.image.path}" class="article-card__image" alt="Article image"/>
                    </figure>
                    <div class="article-card__content">
                        <h2 class="article-card__title" th:text="${article.title}">Title</h2>
                        <p class="article-card__author" th:text="${article.user.username}">Author</p>
                    </div>
                    <footer class="article-card__footer">
                        <a th:href="@{/articles/detail/{id}(id=${article.id})}" class="button button--dark button--full-width">Read</a>
                    </footer>
                </article>
            </div>
            
            <div class="empty-state" th:unless="${articles.size() > 0}">
                <h3 class="empty-state__title">NESSUN ARTICOLO PRESENTE</h3>
            </div>
        </div>
    </section>
    
    <div th:replace="~{index :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
