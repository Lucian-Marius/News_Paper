<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{index :: head}"></head>
<body>
    <div th:replace="~{index :: nav}"></div>
    <div class="m-3">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-10 mb-5">
                    <h1 class="text-center" th:text="${article.title}">Titolo</h1>
                </div>
            </div>
            <div class="container mt-4">
                <!-- Article Image Carousel -->
                <div class="row justify-content-center mb-4">
                    <div class="col-10 col-md-4 offset justify-content-center">
                        <div id="carouselSlide" class="carousel slide">
                            <div class="carousel-inner">
                                <div class="carousel-item active">
                                    <img th:if="${article.image == null}" th:src="@{/images/default.jpg}" class="carousel-img d-block w-100" alt="..."/>
                                    <img th:if="${article.image != null}" th:src="${article.image.path}" class="carousel-img d-block w-100" alt="..."/>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Article Content Section -->
                <div class="row justify-content-center">
                    <div class="col-10">
                        <!-- Subtitle -->
                        <p th:text="${article.subtitle}">Sottotitolo</p>

                        <!-- Author Info -->
                        <div class="container my-5">
                            <p th:text="${'By ' + article.user.username}">By Author</p>
                        </div>

                        <!-- Category -->
                        <div class="row mb-4">
                            <div class="col-1">
                                <a class="badge rounded-pill text-bg-primary" th:href="@{/category/search/{id}(id=${article.category.id})}" th:text="${article.category.name}">Category</a>
                            </div>
                        </div>

                        <!-- Edit & Delete Controls (if author) -->
                        <button class="carousel-control-prev" type="button" data-bs-target="#carouselSlide" data-bs-slide="prev" aria-label="Previous">
                            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                        </button>
                        <button class="carousel-control-next" type="button" data-bs-target="#carouselSlide" data-bs-slide="next" aria-label="Next">
                            <span class="carousel-control-next-icon" aria-hidden="true"></span>
                        </button>

                        <!-- Edit Button -->
                        <div class="row mb-3">
                            <div class="col">
                                <button class="btn btn-warning" type="button" data-bs-toggle="tooltip" title="Modifica articolo">
                                    Modifica
                                </button>
                                <button class="btn btn-danger visually-hidden" type="button" data-bs-toggle="modal" data-bs-target="#deleteArticleModal" title="Elimina articolo">
                                    Elimina
                                </button>
                            </div>
                        </div>

                        <!-- Article Text Content -->
                        <div class="text-center">
                            <p th:text="${article.subtitle}">Sottotitolo</p>
                        </div>

                        <!-- Category Tags -->
                        <div class="row mb-4">
                            <div class="col-3" th:if="${article.category != null}">
                                <a class="link-info link-offset-2 link-underline-opacity-0 link-underline-opacity-75-hover" th:href="@{/category/search/{id}(id=${article.category.id})}" th:text="${article.category.name}">Category</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div th:replace="~{index :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:replace="~{index :: bootscripts}"></script>
    <script>
        function goBack() {
            window.history.back();
        }
    </script>
</body>
</html>
