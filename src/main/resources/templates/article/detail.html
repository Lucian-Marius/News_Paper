<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{index :: head}"></head>
<body>
    <header th:insert="~{index :: header}"></header>
    <div th:replace="~{index :: nav}"></div>
    
    <div class="detail-container">
        <div class="page-container">
            <a href="javascript:history.back()" class="button button--secondary button--small back-button">
                ← Back
            </a>
            
            <article class="article-detail">
                <header class="article-detail__header">
                    <p class="article-detail__label">Title</p>
                    <h1 class="article-detail__title" th:text="${article.title}">Titolo</h1>
                </header>
                
                <!-- Article Image Carousel -->
                <div class="article-detail__image-wrapper">
                    <div id="carouselSlide" class="article-detail__carousel">
                        <div class="article-detail__carousel-inner">
                            <div class="article-detail__carousel-item active">
                                <img th:if="${article.image == null}" th:src="@{/images/default.jpg}" class="article-detail__carousel-image" alt="Default image"/>
                                <img th:if="${article.image != null}" th:src="${article.image.path}" class="article-detail__carousel-image" alt="Article image"/>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Article Content Section -->
                <div class="detail-content">
                    <!-- Subtitle -->
                    <p class="article-detail__label">Subtitle</p>
                    <h2 class="article-detail__subtitle" th:text="${article.subtitle}">Sottotitolo</h2>

                    <!-- Author Info -->
                    <div class="article-detail__meta">
                        <p>Published on <span th:text="${article.publishDate}">data</span> by
                        <a class="article-detail__meta-link" th:href="@{/search/{id}(id=${article.user.id})}" >
                            <span th:text="${article.user.username}">User</span>
                        </a>
                        </p>
                    </div>

                    <!-- Category & Author Tags -->
                    <div class="article-detail__tags" th:if="${article.category != null}">
                        <a class="badge" th:href="@{/categories/search/{id}(id=${article.category.id})}" th:text="${article.category.name}">Category</a>
                    </div>

                    <!-- Article Text Content -->
                    <div class="article-detail__body">
                        <p th:text="${article.body}">Article content goes here</p>
                    </div>
                </div>
            </article>
        </div>
    </div>
    
    <div th:replace="~{index :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:replace="~{index :: bootscripts}"></script>
    <script>
        function goBack() {
            window.history.back();
        }
    </script>
</body>
</html>
