<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{index :: head}"></head>
<body>
    <header th:insert="~{index :: header}"></header>
    <div th:replace="~{index :: nav}"></div>
    <div class="m-3">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-10 mb-5">
                    <h1 class="text-center" th:text="${article.title}">Titolo</h1>
                </div>
            </div>
            <div class="container mt-4">
                <!-- Article Image Carousel -->
                <div class="row justify-content-center mb-4">
                    <div class="col-10 col-md-4 offset justify-content-center">
                        <div id="carouselSlide" class="carousel slide">
                            <div class="carousel-inner">
                                <div class="carousel-item active">
                                    <img th:if="${article.image == null}" th:src="@{/images/default.jpg}" class="carousel-img d-block w-100" alt="..."/>
                                    <img th:if="${article.image != null}" th:src="${article.image.path}" class="carousel-img d-block w-100" alt="..."/>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Article Content Section -->
                <div class="row justify-content-center">
                    <div class="col-10">
                        <!-- Subtitle -->
                        <h5 th:text="${article.subtitle}">Sottotitolo</h5>

                        <!-- Author Info -->
                        <div class="text-muted my-3">
                            <p>Redatto il <p th:text="${article.publishDate}">data</p> da
                            <a class="text-muted" th:href="@{/search/{id}(id=${article.user.id})}" >
                                <p th:text="${article.user.username}">User</p>
                            </a>
                            </p>
                        </div>

                        <!-- Category & Author Tags -->
                        <div class="row mb-4">
                            <div class="col-auto" th:if="${article.category != null}">
                                <a class="badge rounded-pill text-bg-primary" th:href="@{/categories/search/{id}(id=${article.category.id})}" th:text="${article.category.name}">Category</a>
                            </div>
                        </div>



                        <!-- Article Text Content -->
                        <div class="mt-5">
                            <p th:text="${article.body}">Article content goes here</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div th:replace="~{index :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:replace="~{index :: bootscripts}"></script>
    <script>
        function goBack() {
            window.history.back();
        }
    </script>
</body>
</html>
