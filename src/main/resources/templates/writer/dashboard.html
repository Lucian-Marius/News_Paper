<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{index :: head}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Writer Dashboard - News Paper</title>
</head>
<body>
    <header th:insert="~{index :: header}"></header>
    <div th:replace="~{index :: nav}"></div>

    <!-- Main Container -->
    <div class="container mt-5">
        <div class="row justify-content-center">
            <!-- Main Content -->
            <div class="col-md-8">
                <!-- Header -->
                <div class="mb-4">
                    <h1 class="mb-2">Writer Dashboard</h1>
                    <p class="text-muted" th:text="${title}">Your articles</p>
                </div>

                <!-- My Articles Section -->
                <div id="my-articles-section" class="card mb-4">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0">📝 Your Articles</h5>
                    </div>
                    <div class="card-body">
                        <div th:if="${articles.size() > 0}">
                            <div class="table-responsive">
                                <table class="table table-striped table-hover">
                                    <thead class="table-light">
                                        <tr>
                                            <th>Title</th>
                                            <th>Subtitle</th>
                                            <th>Category</th>
                                            <th>Publish Date</th>
                                            <th>Actions</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr th:each="article : ${articles}">
                                            <td th:text="${article.title}">Article Title</td>
                                            <td th:text="${article.subtitle}">Article Subtitle</td>
                                            <td><span th:if="${article.category != null}" th:text="${article.category.name}"></span><span th:unless="${article.category != null}">No Category</span></td>
                                            <td th:text="${#temporals.format(article.publishDate, 'dd/MM/yyyy')}">01/01/2024</td>
                                            <td>
                                                <a th:href="@{'/articles/detail/' + ${article.id}}" class="btn btn-sm btn-info">Read</a>
                                                <a th:href="@{'/articles/edit/' + ${article.id}}" class="btn btn-sm btn-warning">Edit</a>
                                                <a th:href="@{'/articles/delete/' + ${article.id}}" class="btn btn-sm btn-danger" onclick="return confirm('Are you sure you want to delete this article?')">Delete</a>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                        <div th:if="${articles.size() == 0}" class="alert alert-info">
                            You have no articles yet.
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{index :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
