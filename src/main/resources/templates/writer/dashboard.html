<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{index :: head}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Writer Dashboard - News Paper</title>
</head>
<body>
    <header th:insert="~{index :: header}"></header>
    <div th:replace="~{index :: nav}"></div>

    <!-- Main Container -->
    <div class="dashboard-container">
        <div class="page-container">
            <!-- Main Content -->
            <div class="dashboard-content">
                <!-- Header -->
                <div>
                    <h1>Writer Dashboard</h1>
                    <p class="text-muted" th:text="${title}">Your articles</p>
                </div>

                <!-- My Articles Section -->
                <div id="my-articles-section" class="dashboard-card">
                    <div class="dashboard-card__header">
                        <h5 class="dashboard-card__title">Your Articles</h5>
                    </div>
                    <div class="dashboard-card__body">
                        <div th:if="${articles.size() > 0}">
                            <div class="data-table-wrapper">
                                <table class="data-table">
                                    <thead class="data-table__header">
                                        <tr class="data-table__row">
                                            <th class="data-table__header-cell">Title</th>
                                            <th class="data-table__header-cell">Subtitle</th>
                                            <th class="data-table__header-cell">Category</th>
                                            <th class="data-table__header-cell">Publish Date</th>
                                            <th class="data-table__header-cell">Actions</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr class="data-table__row" th:each="article : ${articles}">
                                            <td class="data-table__cell" th:text="${article.title}">Article Title</td>
                                            <td class="data-table__cell" th:text="${article.subtitle}">Article Subtitle</td>
                                            <td class="data-table__cell"><span th:if="${article.category != null}" th:text="${article.category.name}"></span><span th:unless="${article.category != null}">No Category</span></td>
                                            <td class="data-table__cell" th:text="${#temporals.format(article.publishDate, 'dd/MM/yyyy')}">01/01/2024</td>
                                            <td class="data-table__cell">
                                                <a th:href="@{'/articles/detail/' + ${article.id}}" class="button button--info button--small">Read</a>
                                                <a th:href="@{'/articles/edit/' + ${article.id}}" class="button button--secondary button--small">Edit</a>
                                                <a th:href="@{'/articles/delete/' + ${article.id}}" class="button button--danger button--small" onclick="return confirm('Are you sure you want to delete this article?')">Delete</a>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                        <div th:if="${articles.size() == 0}" class="alert alert--info">
                            You have no articles yet.
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{index :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
