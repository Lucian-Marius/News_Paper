<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:fragment="head">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News Paper</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&display=swap" rel="stylesheet">
    <!-- Custom CSS Files -->
    <link rel="stylesheet" th:href="@{/css/variables.css}">
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/layout.css}">
    <link rel="stylesheet" th:href="@{/css/components.css}">
</head>

<body>
    <header th:fragment="header" class="site-header">
        <h1 class="site-header__title">Welcome to news-paper</h1>
        <p class="site-header__subtitle">All the News That Matters, Delivered Fresh Daily</p>
        <span sec:authorize="isAuthenticated()" class="site-header__user-info">
            Welcome: <span th:text="${#authentication.principal.fullName}"></span>
            (<span th:if="${#authentication.principal.authorities.?[authority == 'ROLE_ADMIN'].size() > 0}" th:text="'ADMIN'"></span>
            <span th:if="${#authentication.principal.authorities.?[authority == 'ROLE_ADMIN'].size() == 0 and #authentication.principal.authorities.?[authority == 'ROLE_REVISOR'].size() > 0}" th:text="'REVISOR'"></span>
            <span th:if="${#authentication.principal.authorities.?[authority == 'ROLE_ADMIN'].size() == 0 and #authentication.principal.authorities.?[authority == 'ROLE_REVISOR'].size() == 0}" th:text="'USER'"></span>)
        </span>
    </header>
    
    <nav th:fragment="nav" class="site-nav">
        <div class="site-nav__container">
            <button class="site-nav__toggle" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span>Menu</span>
            </button>
            <div class="site-nav__collapse" id="navbarNav">
                <ul class="site-nav__list">
                    <li class="site-nav__item">
                        <a class="site-nav__link" 
                           th:classappend="${#httpServletRequest != null && (#httpServletRequest.requestURI == '/' || #httpServletRequest.requestURI == '/home')} ? 'site-nav__link--active' : ''"
                           href="/">Home</a>
                    </li>
                    <li class="site-nav__item">
                        <a class="site-nav__link"
                           th:classappend="${#httpServletRequest != null && #strings.startsWith(#httpServletRequest.requestURI, '/articles/create')} ? 'site-nav__link--active' : ''"
                           href="/articles/create">Create Article</a>
                    </li>
                    <li class="site-nav__item">
                        <a class="site-nav__link"
                           th:classappend="${#httpServletRequest != null && #strings.startsWith(#httpServletRequest.requestURI, '/articles') && !#strings.startsWith(#httpServletRequest.requestURI, '/articles/create')} ? 'site-nav__link--active' : ''"
                           href="/articles">Articles</a>
                    </li>
                    <li class="site-nav__item">
                        <a class="site-nav__link"
                           th:classappend="${#httpServletRequest != null && #strings.startsWith(#httpServletRequest.requestURI, '/operations/career')} ? 'site-nav__link--active' : ''"
                           th:href="@{/operations/career/request}">Career Request</a>
                    </li>
                    <li class="site-nav__item" sec:authorize="hasRole('ROLE_ADMIN')">
                        <a class="site-nav__link site-nav__link--with-badge"
                           th:classappend="${#httpServletRequest != null && #strings.startsWith(#httpServletRequest.requestURI, '/admin')} ? 'site-nav__link--active' : ''"
                           href="/admin/dashboard">
                            Dashboard
                            <span class="site-nav__badge" th:if="${careerRequest > 0}" th:text="${careerRequest}"></span>
                        </a>
                    </li>
                    <li class="site-nav__item" sec:authorize="hasRole('ROLE_REVISOR')">
                        <a class="site-nav__link site-nav__link--with-badge"
                           th:classappend="${#httpServletRequest != null && #strings.startsWith(#httpServletRequest.requestURI, '/revisor')} ? 'site-nav__link--active' : ''"
                           href="/revisor/dashboard">
                            Revisor Dashboard
                            <span class="site-nav__badge" th:if="${articlesToBeRevised > 0}" th:text="${articlesToBeRevised}"></span>
                        </a>
                    </li>
                    <li class="site-nav__item" sec:authorize="isAuthenticated() and !hasRole('ROLE_USER')">
                        <a class="site-nav__link"
                           th:classappend="${#httpServletRequest != null && #strings.startsWith(#httpServletRequest.requestURI, '/writer')} ? 'site-nav__link--active' : ''"
                           href="/writer/dashboard">Writer Dashboard</a>
                    </li>
                </ul>
                <ul class="site-nav__list">
                    <li class="site-nav__item" sec:authorize="isAnonymous()">
                        <a class="site-nav__link"
                           th:classappend="${#httpServletRequest != null && #strings.startsWith(#httpServletRequest.requestURI, '/auth/register')} ? 'site-nav__link--active' : ''"
                           th:href="@{/auth/register}">Register</a>
                    </li>
                    <li class="site-nav__item" sec:authorize="isAnonymous()">
                        <a class="site-nav__link"
                           th:classappend="${#httpServletRequest != null && #strings.startsWith(#httpServletRequest.requestURI, '/auth/login')} ? 'site-nav__link--active' : ''"
                           th:href="@{/auth/login}">Login</a>
                    </li>
                    <li class="site-nav__item" sec:authorize="isAuthenticated()">
                        <a class="site-nav__link" th:href="@{/logout}">Logout</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Footer Fragment -->
    <footer th:fragment="footer" class="site-footer">
        <div class="site-footer__container">
            <p>&copy; 2025 News Paper. All rights reserved.</p>
        </div>
    </footer>

    <!-- Bootstrap JS for dropdown functionality -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Thymeleaf fragment for scripts -->
    <div th:fragment="bootscripts">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    </div>
</body>
</html>
